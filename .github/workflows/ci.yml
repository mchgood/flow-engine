name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -Pproduction-verification,release-artifacts install
      - run: python3 scripts/check-coverage.py
      - run: mvn -B -f verification/consumer/pom.xml test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            **/target/surefire-reports/
            **/target/soak-report.txt
            flow-engine-coverage/target/site/jacoco-aggregate/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: flow-engine-packages-${{ github.sha }}
          path: |
            pom.xml
            flow-engine-core/pom.xml
            flow-engine-core/target/*.jar
            flow-engine-spring/pom.xml
            flow-engine-spring/target/*.jar
            flow-engine-spring-boot-starter/pom.xml
            flow-engine-spring-boot-starter/target/*.jar
          if-no-files-found: error
          retention-days: 30
